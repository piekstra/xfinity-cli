[package]
name = "xfinity-cli"
version = "0.10.0"
edition = "2021"
# pk-cli-auth (cli-common v0.21.0) needs 1.89.
rust-version = "1.89"
description = "Manage your Xfinity account from the command line — account, billing, payments, internet usage. Keychain-secured, agent-friendly. Unofficial."
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/xfinity-cli"
homepage = "https://github.com/piekstra/xfinity-cli"
readme = "README.md"
keywords = ["xfinity", "comcast", "billing", "internet", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "xfin"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0", features = ["reqwest"] }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0" }
pk-cli-utility = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0", features = ["mcp"] }
# `xfin mcp`: pk-cli-utility's shared utility/v1 tools, served over stdio or
# 127.0.0.1 (DESIGN.md §1.9).
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0", features = ["stdio", "http"] }
clap_complete = "4"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"

[dev-dependencies]
# The MCP profile's conformance checks, for the tests only.
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.21.0", features = ["test-util"] }
assert_cmd = "2"
predicates = "3"


[profile.release]
strip = true
lto = true
opt-level = "z"
